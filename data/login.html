<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-S3 HID Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f3ff'><path d='M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 5H5v-2h2v2zm0-3H5v-2h2v2zm0-3H5V8h2v2zm9 8H8v-2h8v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 6h-2v-2h2v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2z'/></svg>">
  <link rel="stylesheet" href="/styles.css?v=2.4.0">
</head>
<body class="login-page">
  <main class="panel login-card">
    <h1 class="login-title">ESP32-S3 HID Console</h1>
    <p class="login-sub">Single-operator mode enabled for secure remote control.</p>

    <form id="login-form" class="login-grid">
      <div>
        <label class="label" for="user">Username</label>
        <input class="input" id="user" type="text" autocomplete="username" required>
      </div>
      <div>
        <label class="label" for="pass">Password</label>
        <input class="input" id="pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" type="submit">Sign In</button>
    </form>

    <div id="login-msg" class="login-msg"></div>
    <p class="small">Board profile: ESP32-S3 R8N16</p>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("login-msg");

    async function checkSession() {
      try {
        const res = await fetch("/api/login_status");
        if (!res.ok) return;
        const data = await res.json();
        if (data.loggedIn) {
          window.location.href = "/app";
          return;
        }
        if (data.locked) {
          msg.textContent = "Another user is currently logged in.";
        }
      } catch (_) {
        msg.textContent = "Device is not reachable.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "Signing in...";

      const payload = {
        user: document.getElementById("user").value,
        pass: document.getElementById("pass").value,
      };

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          msg.textContent = "Login success.";
          window.location.href = "/app";
          return;
        }

        if (res.status === 429) {
          const body = await res.json().catch(() => ({}));
          const retryMs = Number(body.retry_after_ms || 0);
          const retrySec = Math.max(1, Math.ceil(retryMs / 1000));
          msg.textContent = `Too many attempts. Try again in ${retrySec}s.`;
        } else if (res.status === 409) {
          msg.textContent = "Session locked: one user is already active.";
        } else if (res.status === 401) {
          msg.textContent = "Invalid username or password.";
        } else {
          msg.textContent = "Login failed. Try again.";
        }
      } catch (_) {
        msg.textContent = "Network error while logging in.";
      }
    });

    checkSession();
  </script>
</body>
</html>
