<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32-S3 HID Console & Security Key Hub</title>
  <meta name="google-site-verification" content="15oUGn7tDY5qFKh0oX7q0zWcuUJ_nFIIjjZk6ixculo" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Technical documentation for ESP32-S3 USB HID, FIDO2 CTAP2 Passkeys, YubiKey 5A Emulation, BadUSB, and Web KVM.">

  <!-- Official Docsify Dark Theme Base -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Professional Developer Theme Overrides */
    :root {
      --theme-color: #3b82f6;
      --text-color-base: #cbd5e1;
      --sidebar-width: 270px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: #0b0f19 !important;
      color: #cbd5e1 !important;
      font-size: 15px !important;
      line-height: 1.6 !important;
    }

    /* Fixed Clean Sidebar */
    .sidebar {
      background-color: #080c14 !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
      width: var(--sidebar-width) !important;
      color: #94a3b8 !important;
      padding: 20px 0 !important;
    }

    .sidebar > h1 {
      margin: 0 0 16px 0 !important;
      padding: 0 20px 14px 20px !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.01em !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .sidebar > h1 a {
      color: #f8fafc !important;
      text-decoration: none !important;
    }

    .sidebar ul {
      margin: 0 !important;
      padding: 0 10px !important;
    }

    .sidebar ul li {
      margin: 2px 0 !important;
      font-size: 0.88rem !important;
    }

    .sidebar ul li a {
      color: #94a3b8 !important;
      font-weight: 500 !important;
      text-decoration: none !important;
      padding: 6px 12px !important;
      border-radius: 6px !important;
      display: block !important;
      transition: all 0.15s ease !important;
    }

    .sidebar ul li a:hover {
      color: #f8fafc !important;
      background-color: rgba(255, 255, 255, 0.05) !important;
      text-decoration: none !important;
    }

    .sidebar ul li.active > a {
      color: #60a5fa !important;
      background-color: rgba(59, 130, 246, 0.12) !important;
      font-weight: 600 !important;
      border-left: 2px solid #3b82f6 !important;
    }

    .sidebar ul li strong {
      color: #64748b !important;
      font-size: 0.72rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      padding: 14px 12px 4px 12px !important;
      display: block !important;
      font-weight: 700 !important;
    }

    /* Main Content Container & Balanced Headings */
    .content {
      padding-top: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: var(--sidebar-width) !important;
      position: absolute !important;
    }

    .markdown-section {
      max-width: 860px !important;
      padding: 30px 45px 80px 45px !important;
      margin: 0 auto !important;
    }

    /* Proper Balanced Heading Hierarchy (Preventing Giant H1) */
    .markdown-section h1 {
      font-size: 1.65rem !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      letter-spacing: -0.02em !important;
      margin-top: 0 !important;
      margin-bottom: 1rem !important;
      padding-bottom: 0.6rem !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      line-height: 1.25 !important;
    }

    .markdown-section h2 {
      font-size: 1.3rem !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
      letter-spacing: -0.015em !important;
      margin-top: 2rem !important;
      margin-bottom: 0.75rem !important;
      padding-bottom: 0.4rem !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .markdown-section h3 {
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      color: #e2e8f0 !important;
      margin-top: 1.5rem !important;
      margin-bottom: 0.5rem !important;
    }

    .markdown-section h4 {
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #cbd5e1 !important;
    }

    .markdown-section p, .markdown-section li {
      color: #cbd5e1 !important;
      font-size: 0.92rem !important;
      line-height: 1.65 !important;
    }

    .markdown-section a {
      color: #60a5fa !important;
      text-decoration: none !important;
      font-weight: 500 !important;
    }

    .markdown-section a:hover {
      text-decoration: underline !important;
    }

    .markdown-section hr {
      border: none !important;
      border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
      margin: 1.8rem 0 !important;
    }

    /* Modern Code Blocks */
    .markdown-section code {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.84em !important;
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .markdown-section pre {
      background-color: #0f172a !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 8px !important;
      padding: 14px 18px !important;
      overflow-x: auto !important;
      margin: 1rem 0 !important;
    }

    .markdown-section pre > code {
      background-color: transparent !important;
      color: #e2e8f0 !important;
      padding: 0 !important;
      border: none !important;
      font-size: 0.85em !important;
      line-height: 1.5 !important;
    }

    /* Structured Tables */
    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 1.2rem 0 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 6px !important;
      overflow: hidden !important;
      font-size: 0.85rem !important;
    }

    .markdown-section th {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      font-weight: 600 !important;
      padding: 9px 12px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.04) !important;
    }

    .markdown-section td {
      padding: 9px 12px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.04) !important;
      color: #cbd5e1 !important;
    }

    .markdown-section tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02) !important;
    }

    /* Clean Search */
    .search {
      padding: 0 16px 14px 16px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      margin-bottom: 10px !important;
    }

    .search input {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      font-size: 0.83rem !important;
      padding: 7px 10px !important;
      width: 100% !important;
      outline: none !important;
    }

    .search input:focus {
      border-color: #3b82f6 !important;
      background: rgba(255, 255, 255, 0.08) !important;
    }

    .github-corner svg {
      fill: #1e293b !important;
      color: #94a3b8 !important;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .content {
        left: 0 !important;
        position: relative !important;
      }
      .markdown-section {
        padding: 20px 18px 60px 18px !important;
      }
      .markdown-section h1 {
        font-size: 1.4rem !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'ESP32-S3 Security Hub',
      repo: 'https://github.com/danish9661/es32s3-hid',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <!-- Docsify Core and Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
